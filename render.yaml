services:
  - type: web
    name: nextjs-docker-backend
    env: docker
    plan: free 
    
    envVars:
      - key: PORT
        value: 3000 
      - key: DB_PORT
        value: 5432 

      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_APP_ID 
        sync: false
        
      - key: GITHUB_PRIVATE_KEY
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false

